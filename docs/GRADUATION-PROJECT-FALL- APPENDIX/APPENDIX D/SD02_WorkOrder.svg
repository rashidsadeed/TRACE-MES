@startuml SD02_WorkOrder

title <size:20><b>TRACE-MES</b></size>\n<size:14>SD-02: Work Order Management</size>

skinparam backgroundColor #FEFEFE
skinparam defaultFontName "Segoe UI"
skinparam defaultFontSize 11
skinparam shadowing false

actor "Supervisor" as Supervisor #90EE90
participant "Web UI" as WebUI #B3D9FF
participant "WorkOrderService" as WOSvc #9370DB
database "Database" as DB #D3D3D3

== Create Work Order ==

Supervisor -> WebUI : Fill work order form
WebUI -> WOSvc : POST /api/workorders
WOSvc -> DB : Validate unique code
WOSvc -> DB : INSERT WorkOrder\n(status = PENDING)
WOSvc -> DB : INSERT AuditLog
WOSvc - -> WebUI : 201 Created
WebUI - -> Supervisor : "Work Order Created"

== Assign to Machine ==

Supervisor -> WebUI : Select machine & operator
WebUI -> WOSvc : POST /api/workorders/{id}/assign
WOSvc -> DB : Verify WorkOrder & Machine
WOSvc -> DB : INSERT WorkOrderAssignment
WOSvc -> DB : INSERT AuditLog
WOSvc - -> WebUI : 200 OK
WebUI - -> Supervisor : "Assignment Successful"

footer <size:10>TRACE-MES | Graduation Project 495/496 | January 2026</size>

@enduml

