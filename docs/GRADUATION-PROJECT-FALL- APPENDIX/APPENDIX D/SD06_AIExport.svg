@startuml SD06_AIExport

title <size:20><b>TRACE-MES</b></size>\n<size:14>SD-06: AI-Ready Data Export</size>

skinparam backgroundColor #FEFEFE
skinparam defaultFontName "Segoe UI"
skinparam defaultFontSize 11
skinparam shadowing false

actor "Supervisor" as Supervisor #90EE90
actor "API Client" as ApiClient #FFDAB9
participant "Web UI" as WebUI #B3D9FF
participant "DataExportService" as ExportSvc #9370DB
database "Database" as DB #D3D3D3
participant "File Storage" as FileStore #D3D3D3

== Request Export (Web UI) ==

Supervisor -> WebUI : Configure date range & format
WebUI -> ExportSvc : POST /api/export/jobs
ExportSvc -> DB : INSERT DataExportJob\n(status = QUEUED)
ExportSvc - -> WebUI : 202 Accepted (jobId)
WebUI - -> Supervisor : "Export job queued"

== Background Processing ==

ExportSvc -> DB : Fetch TelemetryPackets
ExportSvc -> DB : Fetch WorkOrderExecutions
ExportSvc -> DB : Fetch ProductionLogs
ExportSvc -> DB : Fetch ScrapLogs + AnomalySnapshots
ExportSvc -> ExportSvc : Aggregate & normalize data
ExportSvc -> FileStore : Write PARQUET/CSV/JSON
ExportSvc -> DB : UPDATE job → COMPLETED
ExportSvc - -> WebUI : Notify ready

== Download ==

Supervisor -> WebUI : Click Download
WebUI -> ExportSvc : GET /api/export/{id}/download
ExportSvc -> FileStore : Read file
ExportSvc - -> WebUI : File stream
WebUI - -> Supervisor : Download file

== API Client Export ==

ApiClient -> ExportSvc : POST /api/export/jobs\n(with API Key)
ExportSvc -> DB : INSERT DataExportJob
ExportSvc - -> ApiClient : 202 Accepted
note over ApiClient : Poll status or\nreceive webhook

footer <size:10>TRACE-MES | Graduation Project 495/496 | January 2026</size>

@enduml

