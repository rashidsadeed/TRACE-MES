@startuml SD03_Execution

title <size:20><b>TRACE-MES</b></size>\n<size:14>SD-03: Production Execution</size>

skinparam backgroundColor #FEFEFE
skinparam defaultFontName "Segoe UI"
skinparam defaultFontSize 11
skinparam shadowing false

actor "Operator" as Operator #FFB6C1
participant "Web UI" as WebUI #B3D9FF
participant "ExecutionService" as ExecSvc #9370DB
participant "CNCService" as CNCService #9370DB
database "Database" as DB #D3D3D3

== Start Production ==

Operator -> WebUI : Click "Start"
WebUI -> ExecSvc : POST /api/executions/start
ExecSvc -> DB : Update WorkOrder → IN_PROGRESS
ExecSvc -> DB : Update Machine → ACTIVE
ExecSvc -> DB : INSERT WorkOrderExecution
ExecSvc -> CNCService : Start telemetry collection
ExecSvc - -> WebUI : 200 OK
WebUI - -> Operator : Show Live Monitoring

== Pause / Resume ==

Operator -> WebUI : Click "Pause"
WebUI -> ExecSvc : POST /api/executions/{id}/pause
ExecSvc -> DB : Update status → PAUSED
ExecSvc - -> WebUI : 200 OK

Operator -> WebUI : Click "Resume"
WebUI -> ExecSvc : POST /api/executions/{id}/resume
ExecSvc -> DB : Update status → RUNNING
ExecSvc - -> WebUI : 200 OK

== Complete Production ==

Operator -> WebUI : Click "Complete"
WebUI -> ExecSvc : POST /api/executions/{id}/stop
ExecSvc -> DB : Update WorkOrder → COMPLETED
ExecSvc -> DB : Update Machine → IDLE
ExecSvc -> CNCService : Stop telemetry collection
ExecSvc - -> WebUI : 200 OK
WebUI - -> Operator : Navigate to Quality Entry

note over DB
  <b>State Flow:</b>
  PENDING → IN_PROGRESS
  → PAUSED → IN_PROGRESS
  → COMPLETED
end note

footer <size:10>TRACE-MES | Graduation Project 495/496 | January 2026</size>

@enduml

