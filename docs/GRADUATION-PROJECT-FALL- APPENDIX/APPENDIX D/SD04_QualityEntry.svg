@startuml SD04_QualityEntry

title <size:20><b>TRACE-MES</b></size>\n<size:14>SD-04: Quality Entry & Anomaly Capture</size>

skinparam backgroundColor #FEFEFE
skinparam defaultFontName "Segoe UI"
skinparam defaultFontSize 11
skinparam shadowing false

actor "Operator" as Operator #FFB6C1
participant "Web UI" as WebUI #B3D9FF
participant "QualityService" as QCSvc #9370DB
participant "DataExportService" as ExportSvc #9370DB
database "Database" as DB #D3D3D3

== Enter Production Quantities ==

Operator -> WebUI : Enter Good Qty & Scrap Qty
WebUI -> QCSvc : POST /api/quality/production-log
QCSvc -> DB : INSERT ProductionLog
QCSvc - -> WebUI : 200 OK

== Log Scrap with Defect Code ==

Operator -> WebUI : Select DefectCode\n(if scrapQty > 0)
WebUI -> QCSvc : POST /api/quality/scrap-log
QCSvc -> DB : INSERT ScrapLog

== Auto-Capture Anomaly Snapshot ==

QCSvc -> ExportSvc : captureAnomalySnapshot()
ExportSvc -> DB : GET last 5 min telemetry
ExportSvc -> DB : INSERT AnomalySnapshot
ExportSvc - -> QCSvc : snapshotId
QCSvc -> DB : Link ScrapLog → AnomalySnapshot
QCSvc - -> WebUI : 201 Created
WebUI - -> Operator : "Quality data saved\nAnomaly captured for AI"

note over ExportSvc
  Telemetry window captured
  for ML defect analysis
end note

footer <size:10>TRACE-MES | Graduation Project 495/496 | January 2026</size>

@enduml

