services:
  backend:
    build: ./backend
    command: >
      sh -c "
        echo '=== TRACE-MES Backend Startup ===';
        python manage.py migrate --run-syncdb;
        python manage.py seed_factory;
        python manage.py simulator_cli &
        echo 'Simulator CLI started in background';
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build: ./mes-frontend/mes-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./mes-frontend/mes-frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_API_MODE=real
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mes_db
      POSTGRES_USER: mes_user
      POSTGRES_PASSWORD: mes_password
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
    # Data persists across `docker compose down` / `up`.
    # To wipe and reseed from scratch: `docker compose down -v`
    ports:
      - "5432:5432"

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

volumes:
  mes_pgdata:
