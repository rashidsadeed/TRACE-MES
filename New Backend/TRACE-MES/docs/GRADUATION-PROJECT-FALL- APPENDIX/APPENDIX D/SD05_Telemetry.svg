"220" y1="888.1094" y2="888.1094"/><text fill="#000000" font-family="Segoe UI" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="70" x="74" y="883.5151">Clear ALARM</text><text fill="#888888" font-family="Segoe UI" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="276" x="206.5" y="994.1963">TRACE-MES | Graduation Project 495/496 | January 2026</text><!--MD5=[457327ea608bb2d3239aff0abd578562]
@startuml SD05_Telemetry

title <size:20><b>TRACE-MES</b></size>\n<size:14>SD-05: Live Telemetry Monitoring</size>

skinparam backgroundColor #FEFEFE
skinparam defaultFontName "Segoe UI"
skinparam defaultFontSize 11
skinparam shadowing false

actor "Supervisor" as Supervisor #90EE90
participant "Live Console" as WebUI #B3D9FF
participant "CNCService" as CNCService #9370DB
participant "MockDataGenerator" as SimAdapter #FFDAB9
database "Database" as DB #D3D3D3

== Initialize Dashboard ==

Supervisor -> WebUI : Open Live Console
WebUI -> CNCService : GET /api/live/overview
CNCService -> DB : Get machines & status
CNCService - -> WebUI : Machine list with telemetry
WebUI - -> Supervisor : Display machine cards

== Real-Time Telemetry Stream ==

WebUI -> CNCService : Subscribe WebSocket
loop Every 1 second
    SimAdapter -> CNCService : Generate telemetry
    CNCService -> DB : INSERT TelemetryPacket
    CNCService - -> WebUI : Push telemetry data
    WebUI - -> Supervisor : Update charts & gauges
end

== Connection Loss Detection ==

SimAdapter ->x CNCService : [No data > 3 sec]
CNCService -> DB : Update Machine → OFFLINE
CNCService -> DB : INSERT MachineEvent\n(HEARTBEAT_LOST)
CNCService - -> WebUI : Push status change
WebUI - -> Supervisor : Show ALARM indicator

== Connection Recovery ==

SimAdapter -> CNCService : Telemetry resumed
CNCService -> DB : Update Machine → ACTIVE
CNCService -> DB : INSERT MachineEvent\n(HEARTBEAT_RESTORED)
CNCService - -> WebUI : Push status change
WebUI - -> Supervisor : Clear ALARM

footer <size:10>TRACE-MES | Graduation Project 495/496 | January 2026</size>

@enduml

