@startuml SD01_Authentication

title <size:20><b>TRACE-MES</b></size>\n<size:14>SD-01: User Authentication</size>

skinparam backgroundColor #FEFEFE
skinparam defaultFontName "Segoe UI"
skinparam defaultFontSize 11
skinparam shadowing false

actor "User" as User #E8F4FD
participant "Web UI" as WebUI #B3D9FF
participant "AuthService" as AuthSvc #9370DB
database "Database" as DB #D3D3D3

== Login ==

User -> WebUI : Enter username & password
WebUI -> AuthSvc : POST /api/auth/login
AuthSvc -> DB : Verify credentials
DB - -> AuthSvc : User + Role
AuthSvc -> DB : Create UserSession
AuthSvc - -> WebUI : JWT Token + User Info
WebUI - -> User : Redirect to Dashboard

== Auto-Logout ==

WebUI -> AuthSvc : Heartbeat (every 60s)
AuthSvc -> DB : Update lastActivityAt

note over AuthSvc
  If inactive > 15 min
  → Session expired
end note

AuthSvc - -> WebUI : 401 Session Expired
WebUI - -> User : Redirect to Login

== Logout ==

User -> WebUI : Click Logout
WebUI -> AuthSvc : POST /api/auth/logout
AuthSvc -> DB : End UserSession
AuthSvc - -> WebUI : 200 OK
WebUI - -> User : Redirect to Login

footer <size:10>TRACE-MES | Graduation Project 495/496 | January 2026</size>

@enduml

